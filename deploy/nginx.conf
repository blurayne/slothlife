server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Service-worker + entry point: never cache. Clients should
  # always pick up new deploys; long-lived caches on these
  # break installs and PWA updates. (Modern Chrome enforces a
  # ≤24 h cap on sw.js anyway, but the explicit form is
  # belt-and-braces and matches Pages' behaviour.)
  location = /sw.js         { add_header Cache-Control "no-cache" always; }
  location = /index.html    { add_header Cache-Control "no-cache" always; }
  location = /manifest.json { add_header Cache-Control "no-cache" always; }
  location = /              { add_header Cache-Control "no-cache" always; try_files /index.html =404; }

  # Hashable static assets — the deploy pipeline appends ?v=<sha>
  # to assets/main.js etc., so a long immutable cache is safe.
  location ~* \.(js|css|png|svg|webp|mp3|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  # Minimal safety headers. No CSP for now — the app loads
  # convex.cloud at runtime in production deploys, configured
  # via the env-stamped backend-config.js, so a strict CSP
  # would need a per-deploy source list.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 512;

  # Static-only — no SPA-style /api fallback. A real 404 for
  # missing icons is more useful than silently returning the
  # index page.
  location / {
    try_files $uri $uri/ =404;
  }

  # Healthcheck for k8s probes + docker-compose healthcheck.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
