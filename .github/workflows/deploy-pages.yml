# Deploys the static site (index.html + assets/) to GitHub Pages.
# First-time setup: in the repository settings, set
#   Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Opt the JavaScript actions in this workflow into Node.js 24 ahead of
# GitHub's June 2026 default switch — silences the Node 20 deprecation
# warning and keeps actions/checkout / configure-pages / upload-pages-
# artifact / deploy-pages working when Node 20 is removed in Sep 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # checkout@v5 is the first major that natively targets Node 24,
      # so this one drops out of the "forced to Node 24" warning list.
      # configure-pages / upload-pages-artifact / deploy-pages have no
      # Node-24-native major yet (as of late-2025); the workflow-level
      # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 keeps them working under
      # Node 24 with an informational notice that lists them.
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Stamp version.js
        run: |
          set -euo pipefail
          # Build version.js with one echo per line — no heredoc whitespace
          # gotchas. Then cat it back so the workflow log shows exactly
          # what the deployed file will contain (verifiable from the
          # Actions tab if anyone wonders whether the stamp ran).
          {
            echo "window.APP_ENV     = 'github-pages';"
            echo "window.APP_VERSION = '${{ github.ref_name }}';"
            echo "window.APP_BUILD   = '${{ github.run_number }}';"
            echo "window.APP_DATE    = '$(date -u +%Y-%m-%dT%H:%M:%SZ)';"
            echo "window.APP_SHA     = '${{ github.sha }}';"
          } > assets/version.js
          echo "--- stamped assets/version.js ---"
          cat assets/version.js
          # Sanity: APP_SHA must be the substituted 40-char hex, not the
          # literal placeholder. (github.sha is always a real hex string.)
          if grep -qF "APP_SHA     = 'unknown';" assets/version.js; then
            echo "::error::version.js still has APP_SHA='unknown' — stamp failed"
            exit 1
          fi
      - name: Cache-bust HTML asset URLs
        run: |
          set -euo pipefail
          # Replace the ?v=dev cache-bust placeholder on every <link>/<script>
          # in index.html with the current commit SHA so browsers reload the
          # CSS/JS on each deploy. Audio fetched in JS uses window.APP_SHA
          # (set by the stamp step above) for the same purpose.
          sed -i \
            -e "s/?v=dev/?v=${{ github.sha }}/g" \
            -e "s/name=\"app-version\" content=\"dev\"/name=\"app-version\" content=\"${{ github.sha }}\"/" \
            index.html
          echo "--- index.html script/link tags + meta ---"
          grep -E '(href|src)="assets/|name="app-version"' index.html || true
          if grep -q "?v=dev" index.html; then
            echo "::error::index.html still has ?v=dev — sed failed"
            exit 1
          fi
          if grep -qF 'name="app-version" content="dev"' index.html; then
            echo "::error::index.html still has app-version=dev — sed failed"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
