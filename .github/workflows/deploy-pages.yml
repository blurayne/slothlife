# Deploys the static site (index.html + assets/) to GitHub Pages.
# First-time setup: in the repository settings, set
#   Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp version.js
        run: |
          cat > assets/version.js <<EOF
          window.APP_VERSION = '${{ github.ref_name }}';
          window.APP_BUILD   = '${{ github.run_number }}';
          window.APP_DATE    = '$(date -u +%Y-%m-%dT%H:%M:%SZ)';
          window.APP_SHA     = '${{ github.sha }}';
          EOF
      - name: Cache-bust HTML asset URLs
        run: |
          # Replace the ?v=dev cache-bust placeholder on every <link>/<script>
          # in index.html with the current commit SHA so browsers reload the
          # CSS/JS on each deploy. Audio fetched in JS uses window.APP_SHA
          # (set by the stamp step above) for the same purpose.
          sed -i "s/?v=dev/?v=${{ github.sha }}/g" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
