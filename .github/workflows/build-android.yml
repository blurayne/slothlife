# Builds the Android TWA (Trusted Web Activity) wrapper for the
# deployed Pages site, using Bubblewrap. Produces a debug-signed
# APK + AAB as a workflow artifact — sideloadable directly.
#
# IMPORTANT — first-run reality check:
#   * Bubblewrap's build needs a real PNG icon set live at the
#     deployed origin (referenced by twa-manifest.json's iconUrl /
#     maskableIconUrl). The deploy-pages workflow renders these
#     into /icons/ on every Pages deploy, so push to main and
#     wait for that workflow to finish before triggering this one.
#   * The keystore generated below is throwaway / debug-only.
#     For Play Store releases, replace the keytool step with one
#     that pulls a real keystore + passwords from repository
#     secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASS, …).
#   * For Play Store distribution you also need an
#     /.well-known/assetlinks.json on blurayne.github.io carrying
#     the SHA-256 fingerprint of the signing key. Until that's
#     hosted on the *root* domain (this repo deploys at /slothlife/,
#     not the root) the address bar will show inside the TWA.
#
# Manual trigger only — sloth's-life web releases don't need to
# block on Android builds, so the workflow runs on workflow_dispatch.

name: Build Android (TWA)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Workflow-wide non-interactive defaults. CI=true is read by many
  # tools (npm, Vercel CLI, Convex, …) to disable spinners + prompts.
  # DEBIAN_FRONTEND=noninteractive prevents apt postinst scripts
  # (tzdata, …) from prompting and hanging the runner.
  CI: "true"
  DEBIAN_FRONTEND: noninteractive
  # Throwaway debug-keystore passwords. The same string is passed to
  # `keytool -genkeypair` below and read by Bubblewrap's build step
  # via these env vars — keeps both ends in lockstep and means the
  # build never drops to an interactive password prompt. Replace
  # both with secret-derived values for production releases.
  BUBBLEWRAP_KEYSTORE_PASSWORD: android
  BUBBLEWRAP_KEY_PASSWORD: android

jobs:
  build:
    runs-on: ubuntu-latest
    # Belt-and-suspenders: the per-step timeouts below kill any single
    # hung command quickly, and this job-level cap means a stuck
    # workflow can't burn more than 30 min of runner time.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Bubblewrap drives Gradle, which needs a JDK. Temurin 17 is
      # the long-term-support default that the Android Gradle Plugin
      # currently targets.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Render the same PNGs the deploy-pages workflow ships, so
      # bubblewrap can pick them up locally without depending on
      # network availability of the deployed icons.
      - name: Render PNG icons from SVG
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick
          mkdir -p icons
          rsvg-convert -w 192 -h 192 assets/favicon.svg -o icons/icon-192.png
          rsvg-convert -w 512 -h 512 assets/favicon.svg -o icons/icon-512.png
          rsvg-convert -w 410 -h 410 assets/favicon.svg -o icons/_inner.png
          convert -size 512x512 xc:'#7A4A28' \
            \( icons/_inner.png \) -gravity center -composite \
            icons/icon-mask-512.png
          rm icons/_inner.png
          ls -la icons/

      - name: Install Bubblewrap CLI
        run: |
          set -euo pipefail
          npm i -g --no-audit --no-fund @bubblewrap/cli@latest
          # Log the version via npm rather than `bubblewrap --version`.
          # Any direct bubblewrap invocation BEFORE the config file is
          # in place runs the first-run wizard (yes, even --version),
          # so a bare `bubblewrap --version` here would dead-end with
          # exit 130. `npm ls` reads package.json off disk; no
          # bubblewrap process spawns.
          npm ls -g --depth=0 @bubblewrap/cli || true

      # Pre-write ~/.bubblewrap/config.json so the first-run wizard
      # is skipped entirely.
      #
      # Verified against current main-branch source
      # (packages/cli/src/lib/config.ts, function loadOrCreateConfig):
      #
      #   if (!config.jdkPath)        { …prompt… }
      #   if (!config.androidSdkPath) { …prompt… }
      #
      # The wizard ONLY fires when these fields are falsy. There's no
      # filesystem-existence re-check, no env-var bypass, no CLI flag
      # to disable the prompt — the config file is the only documented
      # escape hatch (issues #172, #243, #806 all confirm the
      # maintainer hasn't shipped any other automation surface).
      #
      # The Android SDK layout on ubuntu-latest puts the cmdline-tools
      # at $ANDROID_HOME/cmdline-tools/<version>/, but Bubblewrap's
      # AndroidSdkTools.checkSdkPath validator requires
      # $ANDROID_HOME/tools/ or $ANDROID_HOME/bin/ at the SDK root
      # (older / newer cmdline-tools layouts). Neither exists on the
      # runner image, so we symlink cmdline-tools/<version> → tools
      # to satisfy the validator. Without this, init logs:
      #   "cli ERROR The provided androidSdk isn't correct."
      - name: Pre-configure Bubblewrap (skip first-run wizard + fix SDK layout)
        run: |
          set -euo pipefail
          : "${JAVA_HOME:?JAVA_HOME must be set by setup-java}"
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$JAVA_HOME"        || { echo "::error::JAVA_HOME path missing: $JAVA_HOME"; exit 1; }
          test -d "$ANDROID_SDK_PATH" || { echo "::error::Android SDK path missing: $ANDROID_SDK_PATH"; exit 1; }

          # Locate the cmdline-tools subdir (could be "latest" or a
          # version like "16.0"). Pick whichever exists; ls -d / -1
          # so a single match still reports a usable path.
          CMDLINE_DIR=$(ls -d "$ANDROID_SDK_PATH"/cmdline-tools/*/ 2>/dev/null | head -1)
          if [ -z "$CMDLINE_DIR" ]; then
            echo "::error::No cmdline-tools subdirectory under $ANDROID_SDK_PATH/cmdline-tools/"
            ls -la "$ANDROID_SDK_PATH/cmdline-tools/" 2>&1 || true
            exit 1
          fi
          CMDLINE_REL="cmdline-tools/$(basename "$CMDLINE_DIR")"
          echo "Found cmdline-tools at: $ANDROID_SDK_PATH/$CMDLINE_REL"
          # Symlink only if the validator-expected path isn't already
          # there. The runner-image owner might be root; use sudo so
          # the link is writable in / outside the runner home.
          if [ ! -e "$ANDROID_SDK_PATH/tools" ] && [ ! -e "$ANDROID_SDK_PATH/bin" ]; then
            sudo ln -sfn "$CMDLINE_REL" "$ANDROID_SDK_PATH/tools"
            echo "Created symlink: $ANDROID_SDK_PATH/tools -> $CMDLINE_REL"
          else
            echo "tools/ or bin/ already present at SDK root, no symlink needed"
          fi
          ls -la "$ANDROID_SDK_PATH" | head -20

          # Now write the config that bypasses the first-run wizard.
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' \
            "$JAVA_HOME" "$ANDROID_SDK_PATH" \
            > "$HOME/.bubblewrap/config.json"
          echo "--- ~/.bubblewrap/config.json ---"
          cat "$HOME/.bubblewrap/config.json"
          python3 -c "import json,sys; json.load(open(sys.argv[1])); print('VALID JSON')" \
            "$HOME/.bubblewrap/config.json"

      # Throwaway debug keystore so the build completes end-to-end
      # without operator interaction. SHA-256 fingerprint is printed
      # afterwards for assetlinks.json bootstrapping. Replace with
      # secret-derived keystore for production releases.
      #
      # `-noprompt` makes keytool fail fast rather than wait on stdin
      # if any required field is missing — the explicit -dname /
      # -keypass / -storepass already cover everything keytool would
      # otherwise ask for, but -noprompt is cheap insurance.
      - name: Generate signing keystore
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -noprompt \
            -alias android \
            -keypass "${BUBBLEWRAP_KEY_PASSWORD}" \
            -keystore android.keystore \
            -storepass "${BUBBLEWRAP_KEYSTORE_PASSWORD}" \
            -dname "CN=Sloth, O=Slothlife, C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          echo "--- signing-key SHA-256 (paste into assetlinks.json) ---"
          keytool -list -v \
            -keystore android.keystore \
            -alias android \
            -storepass "${BUBBLEWRAP_KEYSTORE_PASSWORD}" \
            | grep -E '^\s*SHA256:' || true

      # Generate the TWA project from the repo's checked-in
      # twa-manifest.json. We deliberately use `update`, not `init`:
      #
      # * `init --manifest=URL` walks a 5-stage Q&A wizard (domain,
      #   app name, colors, icons, signing key) even when --manifest
      #   pre-fills every default — there's no --non-interactive
      #   flag, just empty-line piping through a PTY. Brittle.
      #
      # * `update` reads twa-manifest.json from disk and calls
      #   generateTwaProject + generateManifestChecksumFile directly.
      #   Verified from packages/cli/src/lib/cmds/shared.ts on main:
      #     - generateTwaProject has ZERO inquirer prompts.
      #     - updateProject has ONE prompt (promptNewAppVersionName)
      #       gated on `skipVersionUpgrade`.
      #
      # Icon-fetch wrinkle: update fetches iconUrl + maskableIconUrl
      # from twa-manifest.json (so the bitmaps can be bundled into
      # the APK). Those URLs point at the deployed Pages site, but
      # on a fresh push this workflow races the Pages deploy and
      # hits 404. Workaround: spin up a local HTTP server in the
      # icon-render output dir and rewrite the two URLs in
      # twa-manifest.json to localhost just for this step. The
      # bitmaps end up identical to what Pages serves (rendered
      # from the same SVG by the workflow's earlier render step).
      # Other URL fields (host, webManifestUrl, fullScopeUrl) are
      # NOT rewritten — they're recorded into the APK's resources
      # for runtime use against the real Pages site.
      - name: Generate TWA project
        timeout-minutes: 10
        run: |
          set -euo pipefail
          bubblewrap --version

          # Serve the locally-rendered icons.
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/icon-srv.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          # Wait briefly for the server to come up + sanity-check the
          # two icons are reachable. Fail fast if either 404s — means
          # the icon-render step earlier didn't produce the file.
          for _ in 1 2 3 4 5; do
            curl -fsS -o /dev/null http://127.0.0.1:8765/icons/icon-512.png && break
            sleep 0.3
          done
          curl -fsS -o /dev/null http://127.0.0.1:8765/icons/icon-512.png
          curl -fsS -o /dev/null http://127.0.0.1:8765/icons/icon-mask-512.png

          # Rewrite ONLY the two icon URLs to point at the local
          # server. iconUrl + maskableIconUrl are fetch-time only —
          # bubblewrap downloads the bitmaps and bakes them into
          # the APK as drawable resources. The URLs themselves don't
          # end up in the APK's runtime config (that uses host,
          # webManifestUrl, fullScopeUrl, startUrl, which we leave
          # alone so they continue to point at the deployed PWA).
          # No need to restore the canonical URLs after — the
          # checksum + manifest stay consistent within this CI run.
          #
          # Using sed (not python heredoc) because YAML run-blocks
          # strip leading indent before bash sees the script —
          # nesting a python heredoc in there is one indent-quirk
          # away from silently producing a no-op patch. Two
          # before/after grep blocks + two `::error` guards make a
          # silent no-op fail the step instead of cascading into
          # the canonical-URL 404.
          echo "--- twa-manifest.json (icon URLs BEFORE patch) ---"
          grep -E '"(icon|maskableIcon)Url"' twa-manifest.json
          sed -i \
            's|"https://blurayne.github.io/slothlife/icons/|"http://127.0.0.1:8765/icons/|g' \
            twa-manifest.json
          echo "--- twa-manifest.json (icon URLs AFTER patch) ---"
          grep -E '"(icon|maskableIcon)Url"' twa-manifest.json
          if grep -q '"https://blurayne.github.io/slothlife/icons/' twa-manifest.json; then
            echo "::error::twa-manifest.json still contains canonical icon URLs after sed rewrite"
            exit 1
          fi
          if ! grep -q '"http://127.0.0.1:8765/icons/' twa-manifest.json; then
            echo "::error::twa-manifest.json never picked up the localhost icon URLs"
            exit 1
          fi

          bubblewrap update --skipVersionUpgrade
          ls -la manifest-checksum.json twa-manifest.json

      # Bubblewrap's build can still raise prompts beyond the wizard:
      # stale-checksum, signing-key questions, etc. Two safety nets:
      #
      #   1. `script(1)` allocates a real PTY so inquirer (which reads
      #      from /dev/tty, not process.stdin) accepts piped input.
      #   2. `yes y` continuously feeds "y\n" answers — any confirm
      #      prompt is auto-accepted. The keystore-password env vars
      #      (workflow scope) cover the only non-confirm prompts in
      #      practice; `yes y` is belt-and-braces for anything else.
      #
      # `exec </dev/null` deliberately NOT used here: closing stdin
      # made inquirer SIGINT 130. Working pattern borrowed from
      # github.com/sharadcodes/pwa-to-apk-action's entrypoint.sh.
      - name: Build TWA
        timeout-minutes: 15
        run: |
          set -euo pipefail
          yes y | script -qec "bubblewrap build --skipPwaValidation" /dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slothlife-android
          # bubblewrap drops the unsigned + signed APK/AAB at the
          # repo root. Glob both and let actions/upload-artifact warn
          # (not fail) if a particular variant didn't materialise.
          path: |
            ./*.apk
            ./*.aab
          if-no-files-found: warn
